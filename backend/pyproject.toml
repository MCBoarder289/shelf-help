[project]
name = "shelf-help-api"
version = "0.1.0"
description = "Backend service for shelf help"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4==4.12.3",
    "boto3==1.35.10",
    "feedparser==6.0.11",
    "flask==3.0.3",
    "flask-caching==2.3.0",
    "gevent==24.2.1",
    "gunicorn==22.0.0",
    "orjson==3.10.3",
    "pydantic==2.7.1",
    "python-dotenv==1.0.1",
    "requests==2.31.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
